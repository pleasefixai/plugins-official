name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what the publish would release, and create nothing.
        type: boolean
        default: true

permissions:
  contents: write

# One publish at a time, and none is cancelled: each one continues the index chain.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: publish
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 refuses the checksums newer AWS tools add by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the tags
        run: git fetch --tags --force origin

      - name: Publish
        run: .github/scripts/publish.sh ${{ inputs.dry_run && '--dry-run' || '' }}
