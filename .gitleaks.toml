# The secret scan of the check workflow reads this file. It keeps gitleaks' default rules and allows only values that cannot be a secret.

[extend]
useDefault = true

[[allowlists]]
description = "The sha256 hash of each upstream skill, in a plugin's manifest (upstream.skills)."
condition = "AND"
paths = ['''^plugins/[^/]+/plugin\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']

[[allowlists]]
description = "Placeholders in vendors' examples, and example JWTs cut short with '...'."
regexTarget = "secret"
regexes = [
  '''^(YOUR_)?(DOWNLOAD_)?ACCESS_TOKEN$''',
  '''^YOUR_[A-Z_]+$''',
  '''^your-password$''',
  '''^xoxb-YOUR-TOKEN$''',
  '''^eyJ[A-Za-z0-9_-]*\.\.\.$''',
  '''^sk-live-abc123\.\.\.$''',
  '''^sk_YOUR_API_KEY$''',
  '''^your-api-key$''',
]

[[allowlists]]
description = "The sample sdk_token values of ClickFunnels' page examples, on old.example."
condition = "AND"
paths = ['''^plugins/clickfunnels/skills/''']
regexTarget = "secret"
regexes = ['''^cfp_aB3xY7zQ9pK2mNvT8r5JcDef$''', '''^cfp_Z9yX8wV7uT6sR5qP4nM3kJ2h$''']

[[allowlists]]
description = "The sample plainToken and encryptedToken of Zoom's webhook validation docs."
condition = "AND"
paths = ['''^plugins/zoom/skills/''']
regexTarget = "secret"
regexes = ['''^qgg8vlvZRS6UYooatFL8Aw$''', '''^23a89b634c017e5364a1c8d9c8ea909b60dd5599e2bb04bb1558d9c3a121faa5$''']

[[allowlists]]
description = "The made-up keys of the 'VULNERABLE' examples in Atlassian's Forge security rules."
condition = "AND"
paths = ['''^plugins/forge-skills/skills/forge-security-review/''']
regexTarget = "secret"
regexes = ['''^sk-1234567890abcdef1234567890abcdef$''', '''^sk_live_abcdefghijklmnop$''']

[[allowlists]]
description = "GitBook's fictional Evolve demo site: a sample idempotency key, and the download tokens of its public logo and icon images."
condition = "AND"
paths = ['''^plugins/gitbook/skills/configure-site/references/example-site/''']
regexTarget = "line"
regexes = ['''7b8f2c4a-91d2-4fe1-9b6a-2c8e5f1a9b0c''', '''files\.gitbook\.io/~/files/v0/b/gitbook-x-prod\.appspot\.com/o/[^"]*[?&]alt=media&token=[0-9a-f-]{36}"''']

[[allowlists]]
description = "The made-up key of the 'Hardcoded credentials' example in Miro's code review patterns."
condition = "AND"
paths = ['''^plugins/miro/skills/miro-code-review/references/''']
regexTarget = "secret"
regexes = ['''^sk_live_abc123$''']

[[allowlists]]
description = "Plain prose in GovTribe's pricing references that the generic rule reads as a key: 'credentialing time, malpractice/professional liability'."
condition = "AND"
paths = ['''^plugins/govtribe/skills/govtribe-pricing-data/references/''']
regexTarget = "line"
regexes = ['''credentialing time, malpractice/professional liability''']

[[allowlists]]
description = "Sample payloads in Port's integration examples: a SonarQube issue key and PagerDuty incident keys."
condition = "AND"
paths = ['''^plugins/port/skills/port-integrations/port-install-integration/references/examples/''']
regexTarget = "secret"
regexes = ['''^AZwuDv7ZacZtUu_jLZSO$''', '''^e20af41f10af47f89468db4e9ac0c618$''', '''^aa3ce5d67016411c98f10ec372c5b921$''', '''^3d137d075f94496e94f6185223cbeba6$''']

[[allowlists]]
description = "The public default token of QStash's local development server: base64 of {\"UserID\":\"defaultUser\",\"Password\":\"defaultPassword\"}."
condition = "AND"
paths = ['''^plugins/upstash/skills/''']
regexTarget = "secret"
regexes = ['''^eyJVc2VySUQiOiJkZWZhdWx0VXNlciIsIlBhc3N3b3JkIjoiZGVmYXVsdFBhc3N3b3JkIn0=$''']

[[allowlists]]
description = "The page id of the 'Secrets Manager' dashboard page in Wix's list of dashboard page ids."
condition = "AND"
paths = ['''^plugins/wix/skills/wix-app/references/dashboard-page/''']
regexTarget = "secret"
regexes = ['''^f94ac43e-52c4-4564-b1da-68df51b9e614$''']

[[allowlists]]
description = "The CLIENT_ID:CLIENT_SECRET placeholder of Zoom's OAuth curl examples."
condition = "AND"
paths = ['''^plugins/zoom/skills/''']
regexTarget = "secret"
regexes = ['''^"CLIENT_ID:CLIENT_SECRET"$''']
